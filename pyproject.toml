[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sintetizador-dessem"
dynamic = ["version"]
dependencies = [
    "click>=8.1.8",
    "idessem>=1.2.1",
    "pyarrow>=19.0.0",
]
requires-python = ">= 3.11"
authors = [
  {name = "Rogerio Alves", email = "rogerioalves.ee@gmail.com"},
  {name = "Mariana Noel", email = "marianasimoesnoel@gmail.com"},
]
description = "sintetizador-dessem"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "sphinx-rtd-theme",
    "sphinx-gallery",
    "sphinx",
    "numpydoc",
    "plotly",
    "matplotlib",
]


[project.urls]
Documentation = "https://rjmalves.github.io/sintetizador-dessem/"
Repository = "https://github.com/rjmalves/sintetizador-dessem/"

[project.scripts]
sintetizador-dessem = "main:main"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
include = [
  "main.py",
  "app/",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["idessem.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["cfinterface.*"]
ignore_errors = true

# idessem .read() classmethods return base types (SectionFile,
# BlockFile, RegisterFile) instead of Self, causing many false-positive
# errors throughout this module.
[[tool.mypy.overrides]]
module = ["app.adapters.repository.files"]
disable_error_code = ["assignment", "return-value", "attr-defined", "unused-ignore"]

[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_errors = true
